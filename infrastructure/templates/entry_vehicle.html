{% extends "base/base.html" %}

{% block title %}Ingreso - ParkPlace{% endblock %}

{% block content %}
<div class="card">

    <h1 style="color: #000000;">Registrar Ingreso</h1>
    <p>Escriba la placa y seleccione el tipo de vehículo.</p>
    <hr style="margin-bottom: 20px; border: 0; border-top: 1px solid #eee;">

    <form method="post" autocomplete="off" id="form-ingreso">
        {% csrf_token %}
        <input type="hidden" name="vehicle_type" id="hidden-type" value="">

        <!-- PLACA -->
        <div style="margin-bottom: 20px;">
            <label style="display:block; margin-bottom:8px; font-weight:bold;">
                Placa del Vehículo:
            </label>
            <input
                type="text"
                name="license_plate"
                placeholder="Ej: ABC123"
                maxlength="6"
                required
                style="width:100%; padding:12px; border-radius:6px; border:1px solid #cbd5e1; text-transform: uppercase; font-size: 18px;"
                oninput="this.value = this.value.toUpperCase()"
            >
        </div>

        <!-- TIPO VEHÍCULO -->
        <div style="margin-bottom: 25px;">
            <label style="display:block; margin-bottom:8px; font-weight:bold;">
                Tipo de Vehículo:
            </label>
            <div style="display:flex; flex-direction:column; gap:8px;">
                <label style="display:flex; align-items:center; gap:10px; padding:10px 14px; border:1px solid #cbd5e1; border-radius:6px; cursor:pointer; font-size:14px;" id="opt-CAR">
                    <input type="radio" name="tipo_visual" value="CAR" onchange="selectType('CAR')" style="accent-color:#1e3a8a; width:16px; height:16px;">
                    Carro
                </label>
                <label style="display:flex; align-items:center; gap:10px; padding:10px 14px; border:1px solid #cbd5e1; border-radius:6px; cursor:pointer; font-size:14px;" id="opt-MOTORCYCLE">
                    <input type="radio" name="tipo_visual" value="MOTORCYCLE" onchange="selectType('MOTORCYCLE')" style="accent-color:#1e3a8a; width:16px; height:16px;">
                    Moto
                </label>
            </div>
            <p id="type-error" style="color:#b91c1c; font-size:13px; display:none; margin:6px 0 0 0;">
                Debes seleccionar un tipo de vehículo.
            </p>
        </div>

        <!-- BOTÓN -->
        <button type="button" onclick="submitIngreso()" style="
            background:#1e3a8a;
            color:white;
            border:none;
            padding:14px 30px;
            border-radius:6px;
            cursor:pointer;
            font-weight:bold;
            width: 100%;
        ">
            Registrar Entrada
        </button>

    </form>

    <!-- ERROR -->
    {% if error %}
        <div style="margin-top: 20px; padding: 15px; background: #fee2e2; color: #b91c1c; border-radius: 6px; font-weight: bold;">
            {{ error }}
        </div>
    {% endif %}

</div>

<script>
function selectType(value) {
    document.getElementById('hidden-type').value = value;
    document.getElementById('type-error').style.display = 'none';

    ['CAR', 'MOTORCYCLE'].forEach(function(t) {
        var el = document.getElementById('opt-' + t);
        if (el) {
            el.style.borderColor = t === value ? '#1e3a8a' : '#cbd5e1';
            el.style.background  = t === value ? '#eff6ff' : 'white';
        }
    });
}

function submitIngreso() {
    if (!document.getElementById('hidden-type').value) {
        document.getElementById('type-error').style.display = 'block';
        return;
    }
    document.getElementById('form-ingreso').submit();
}
</script>

{% endblock %}
